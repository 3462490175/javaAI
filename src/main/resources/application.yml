    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ai_sql?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 12345
  ai:
    openai:
      chat:
        options:
          model: deepseek-ai/DeepSeek-V3
          tool-calling:
            enabled: true
      completions-path: /v1/chat/completions
      api-key: sk-wvxtnxfglcdeygbvihscljcerdkqriqxrnrecbnjzmmwfhte
      base-url: https://api.siliconflow.cn

server:
  port: 1236
# ✅ jwt 必须是顶层配置，与 spring / server 平级
jwt:
  # 秘钥（HS256 算法要求至少 32 字节，也就是至少 32 个 ASCII 字符）
  secret: mySuperSecretKeyForAiHouProject1234567890!
  # 访问 Token 过期时间（毫秒），24 小时
  expiration: 86400000
  # 刷新 Token 过期时间（毫秒），7 天
  refresh-expiration: 604800000
  # 发布者
  issuer: ai-hou-backend
  # 前端携带 Token 的请求头名称
  header: Authorization
  # Token 前缀（注意 Bearer 后面有一个空格）
  prefix: "Bearer "